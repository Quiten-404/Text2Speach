name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython
      
      - name: Clean old buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
      
      - name: Setup Android SDK and NDK
        run: |
          # Создаём структуру
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          
          # Скачиваем SDK tools
          mkdir -p android-sdk/tools/bin
          cd android-sdk
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          unzip -q sdk-tools-linux-4333796.zip
          rm sdk-tools-linux-4333796.zip
          yes | tools/bin/sdkmanager --licenses || true
          tools/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" || true
          
          # Скачиваем NDK 25c
          cd ..
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          rm android-ndk-r25c-linux.zip
      
      - name: Build APK
        run: |
          # Устанавливаем переменные окружения
          export ANDROIDSDK=~/.buildozer/android/platform/android-sdk
          export ANDROIDNDK=~/.buildozer/android/platform/android-ndk-r25c
          export ANDROIDAPI=30
          export ANDROIDMINAPI=21
          
          # Создаём buildozer.spec заново с правильными путями
          cat > buildozer.spec << 'EOF'
[app]
title = НейроГолос
package.name = neurovoice
package.domain = org.ttsapp
source.dir = .
source.include_exts = py,png,jpg,kv,atlas
version = 1.0.0
requirements = python3,kivy,kivymd,pyjnius,android,pyttsx3
orientation = portrait
android.permissions = INTERNET, RECORD_AUDIO
android.api = 30
android.minapi = 21
android.ndk = 25c
log_level = 2
EOF
          
          # Запускаем сборку
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Text2Speach-App
          path: bin/*.apk
