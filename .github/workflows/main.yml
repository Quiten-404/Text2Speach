name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool
          pip install buildozer cython
      
      - name: Configure Android SDK
        run: |
          # Создаём правильную структуру для SDK
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Скачиваем command line tools (новая версия)
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # Устанавливаем SDK
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          
          # Принимаем лицензии
          yes | sdkmanager --licenses
          
          # Устанавливаем нужные компоненты
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
      
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Text2Speach-App
          path: bin/*.apk
