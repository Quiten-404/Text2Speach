name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool
          pip install buildozer cython
      
      - name: Setup Android SDK
        run: |
          # Создаём структуру в точности как ожидает Buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # Скачиваем старую версию SDK tools (которая имеет нужную структуру)
          cd ~/.buildozer/android/platform/android-sdk
          wget -q https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          unzip -q sdk-tools-linux-4333796.zip
          rm sdk-tools-linux-4333796.zip
          
          # Принимаем лицензии
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
          
          # Устанавливаем платформы
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" > /dev/null 2>&1
          
          # Устанавливаем NDK (альтернативный способ)
          cd ~/.buildozer/android/platform
          wget -q https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip
          rm android-ndk-r23b-linux.zip
      
      - name: Build APK
        run: |
          export PATH=~/.buildozer/android/platform/android-sdk/tools/bin:$PATH
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Text2Speach-App
          path: bin/*.apk
